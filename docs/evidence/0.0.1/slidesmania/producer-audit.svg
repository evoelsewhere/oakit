<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">OAKit real-world PowerPoint producer audit</title>
  <desc id="description">Thirty SlidesMania templates containing 733 slides and 9,285 elements passed strict parsing, Google Slides import and export, attribution checks, and Office-free rendering. Approximation warnings remain visible as technical debt.</desc>
  <rect width="1600" height="900" fill="#07111f"/>
  <rect x="0" y="0" width="16" height="900" fill="#41dfbd"/>
  <text x="72" y="84" fill="#41dfbd" font-family="Arial, sans-serif" font-size="24" font-weight="700">REAL-WORLD PRODUCER EVIDENCE</text>
  <text x="72" y="142" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">SlidesMania → Google Slides → PPTX → image</text>
  <text x="72" y="184" fill="#9cb0c8" font-family="Arial, sans-serif" font-size="22">Controlled Drive import/export · strict parser · Office-free SVG/PNG · temporary files deleted</text>

  <g font-family="Arial, sans-serif">
    <rect x="72" y="232" width="330" height="150" rx="18" fill="#10253f"/>
    <text x="98" y="278" fill="#9cb0c8" font-size="20">Templates</text>
    <text x="98" y="350" fill="#f8fafc" font-size="64" font-weight="700">30 / 30</text>

    <rect x="426" y="232" width="330" height="150" rx="18" fill="#10253f"/>
    <text x="452" y="278" fill="#9cb0c8" font-size="20">Slides rendered twice</text>
    <text x="452" y="350" fill="#f8fafc" font-size="64" font-weight="700">733</text>

    <rect x="780" y="232" width="330" height="150" rx="18" fill="#10253f"/>
    <text x="806" y="278" fill="#9cb0c8" font-size="20">Source elements</text>
    <text x="806" y="350" fill="#f8fafc" font-size="64" font-weight="700">9,285</text>

    <rect x="1134" y="232" width="394" height="150" rx="18" fill="#164b45"/>
    <text x="1160" y="278" fill="#9debdc" font-size="20">Minimum retention</text>
    <text x="1160" y="342" fill="#f8fafc" font-size="54" font-weight="700">100%</text>
    <text x="1340" y="322" fill="#9debdc" font-size="18">text</text>
    <text x="1340" y="350" fill="#9debdc" font-size="18">elements</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="72" y="450" fill="#f8fafc" font-size="26" font-weight="700">End-to-end gate</text>
    <rect x="72" y="482" width="340" height="92" rx="16" fill="#10253f"/>
    <circle cx="112" cy="528" r="18" fill="#41dfbd"/>
    <path d="M103 528l7 7 13-16" fill="none" stroke="#07111f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="146" y="518" fill="#f8fafc" font-size="21" font-weight="700">Source PPTX</text>
    <text x="146" y="548" fill="#9cb0c8" font-size="17">strict parse + full render</text>
    <path d="M430 528h74" stroke="#ffcf5a" stroke-width="6" stroke-linecap="round"/>
    <path d="M491 514l18 14-18 14" fill="none" stroke="#ffcf5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="528" y="482" width="430" height="92" rx="16" fill="#10253f"/>
    <circle cx="568" cy="528" r="18" fill="#41dfbd"/>
    <path d="M559 528l7 7 13-16" fill="none" stroke="#07111f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="602" y="518" fill="#f8fafc" font-size="21" font-weight="700">Google Slides producer</text>
    <text x="602" y="548" fill="#9cb0c8" font-size="17">import + export + delete 30/30</text>
    <path d="M976 528h74" stroke="#ffcf5a" stroke-width="6" stroke-linecap="round"/>
    <path d="M1037 514l18 14-18 14" fill="none" stroke="#ffcf5a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1074" y="482" width="454" height="92" rx="16" fill="#164b45"/>
    <circle cx="1114" cy="528" r="18" fill="#41dfbd"/>
    <path d="M1105 528l7 7 13-16" fill="none" stroke="#07111f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1148" y="518" fill="#f8fafc" font-size="21" font-weight="700">Exported PPTX</text>
    <text x="1148" y="548" fill="#9debdc" font-size="17">strict parse + full render</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="72" y="646" fill="#f8fafc" font-size="26" font-weight="700">Transparent rendering debt</text>
    <text x="72" y="678" fill="#9cb0c8" font-size="17">Google-export warning counts · successful output, not a full-fidelity claim</text>

    <text x="72" y="730" fill="#f8fafc" font-size="18">Shapes</text>
    <rect x="190" y="710" width="920" height="24" rx="12" fill="#1d334c"/>
    <rect x="190" y="710" width="920" height="24" rx="12" fill="#ffcf5a"/>
    <text x="1130" y="730" fill="#f8fafc" font-size="18" font-weight="700">3,807</text>

    <text x="72" y="774" fill="#f8fafc" font-size="18">Fills</text>
    <rect x="190" y="754" width="920" height="24" rx="12" fill="#1d334c"/>
    <rect x="190" y="754" width="361" height="24" rx="12" fill="#69d9c4"/>
    <text x="1130" y="774" fill="#f8fafc" font-size="18" font-weight="700">1,496</text>

    <text x="72" y="818" fill="#f8fafc" font-size="18">Media</text>
    <rect x="190" y="798" width="920" height="24" rx="12" fill="#1d334c"/>
    <rect x="190" y="798" width="227" height="24" rx="12" fill="#6ea8fe"/>
    <text x="1130" y="818" fill="#f8fafc" font-size="18" font-weight="700">941</text>

    <text x="72" y="862" fill="#f8fafc" font-size="18">Tables</text>
    <rect x="190" y="842" width="920" height="24" rx="12" fill="#1d334c"/>
    <rect x="190" y="842" width="48" height="24" rx="12" fill="#b294f4"/>
    <text x="1130" y="862" fill="#f8fafc" font-size="18" font-weight="700">199</text>

    <text x="1260" y="716" fill="#41dfbd" font-size="18" font-weight="700">PASS</text>
    <text x="1260" y="750" fill="#9cb0c8" font-size="16">Run 32036893093</text>
    <text x="1260" y="780" fill="#9cb0c8" font-size="16">Node 22 · Linux</text>
    <text x="1260" y="810" fill="#9cb0c8" font-size="16">No Office runtime</text>
    <text x="1260" y="840" fill="#9cb0c8" font-size="16">Attribution preserved</text>
  </g>
</svg>
