name: Google Slides Producer Evidence

on:
  workflow_dispatch:
    inputs:
      corpus:
        description: Verify the 30-template visual corpus
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  producer:
    name: Controlled Google Slides import and export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: producer-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import, export, verify, and delete temporary presentations
        if: ${{ !inputs.corpus }}
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: pnpm test:producer:google-slides
      - name: Verify 30 complex visual templates through Google Slides
        if: ${{ inputs.corpus }}
        env:
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: pnpm test:producer:slidesmania
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-slides-powerpoint-producer-evidence
          path: reports/reliability/pptx-google-*
          if-no-files-found: error
